# Publishes main to Cloudflare (a Worker with static assets: wrangler.jsonc).
#
# GitHub Pages keeps publishing main as it always has; this job runs beside
# it, so both hosts serve the same commit until the owner moves the domain.
#
# Until the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# exist, every run stops at the first step with a notice and succeeds, so no
# push fails because of this file. The token needs the account permission
# "Workers Scripts: Edit" (Cloudflare's "Edit Cloudflare Workers" template).
#
# The daily rates job pushes with the workflow's own token, and GitHub does
# not start push workflows for such pushes, so this job also runs after each
# successful "Update currency rates" run: otherwise assets/rates.json would
# go stale on Cloudflare while GitHub Pages refreshed it.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Update currency rates']
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Reads the repository; the deploy itself uses the Cloudflare token.
permissions:
  contents: read

# One deploy at a time, the newest last; a queued run is replaced by a newer one.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Cloudflare deploy skipped::The repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, so nothing was deployed to Cloudflare. GitHub Pages is unaffected. Add both under Settings > Secrets and variables > Actions to turn this deploy on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          # after a rates run, deploy main as it is now (with the new rates)
          ref: main

      - uses: actions/setup-node@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: '22'

      # Cloudflare refuses any file over 25 MiB: fail here, with the file
      # named, rather than half-way through an upload. _redirects is rebuilt
      # from the stubs so a stub added without it still gets its redirect.
      - name: Check file sizes and rebuild _redirects
        if: steps.secrets.outputs.ready == 'true'
        run: |
          node build/split-models.js --check
          node build/cf-redirects.js

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy --message "$(git log -1 --format='%h %s' | cut -c1-100)"
