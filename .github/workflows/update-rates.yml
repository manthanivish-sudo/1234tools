# Refreshes assets/rates.json once a day.
#
# The currency converter used to fetch rates from cdn.jsdelivr.net in the
# visitor's browser, on page load, before any consent. This job moves that call
# to a GitHub runner: the upstream feed now sees CI instead of a reader, and the
# reader's browser only ever talks to 1234tools.com.
#
# Pushing to main IS the deploy — GitHub Pages serves this branch directly, with
# no build step — so a successful run here publishes the new rates.
#
# Note GitHub disables scheduled workflows in a repository with no pushes for 60
# days. This job pushing daily keeps itself alive, but if rates ever go stale for
# weeks, check whether the schedule was disabled before suspecting the script.
name: Update currency rates

on:
  schedule:
    # 05:17 UTC. Both feeds publish their daily fix well before this, and the
    # odd minute keeps it off the top-of-hour queue when Actions is busiest.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      verify_push:
        # The scheduled run only exercises the commit-and-push path on a day a
        # rate actually moved, so a broken token, a missing permission or a
        # protected branch would sit undetected until that day -- and would then
        # look like a rate-fetching bug. This pushes an empty commit on demand so
        # the path can be proven now. Safe to run: an empty commit changes no
        # file, so the Pages deploy it triggers republishes identical content.
        description: 'Prove the commit-and-push path by pushing an empty commit'
        type: boolean
        default: false

# Only what pushing the one file needs.
permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # v5 on both: the v4 runtimes target Node 20, which the runners now force
      # onto Node 24 with a deprecation warning on every run.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Only has to run build/fetch-rates.js, which uses global fetch and
          # nothing else exotic. 22 rather than 20 because Node 20 is past end
          # of life.
          node-version: '22'

      - name: Fetch rates
        run: node build/fetch-rates.js

      - name: Commit if anything moved
        env:
          # Empty on a scheduled run, so the comparison below simply fails.
          VERIFY_PUSH: ${{ inputs.verify_push }}
        run: |
          MSG="Refresh currency rates ($(date -u +%Y-%m-%d))"
          if git diff --quiet -- assets/rates.json; then
            if [ "$VERIFY_PUSH" != "true" ]; then
              echo "No rate moved today — nothing to commit."
              exit 0
            fi
            echo "No rate moved, but verify_push was requested."
            ALLOW_EMPTY=--allow-empty
            MSG="Verify the rates workflow can push (no rate changed)"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rates.json
          git commit ${ALLOW_EMPTY:-} -m "$MSG"
          # The concurrency group keeps this job from racing itself, but not from
          # racing a hand push -- and this branch is deployed by hand regularly.
          # Losing a day of rates to a non-fast-forward is a silly way to fail, so
          # rebase onto whatever landed and try once more.
          git push || { git pull --rebase origin main && git push; }
